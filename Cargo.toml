[package]
name = "kafgui"
version = "0.1.0"
description = "A GUI application for interacting with Kafka."
authors = ["Dustin Dobervich <ddobervich@gmail.com>"]
license = "MIT"
edition = "2024"
rust-version = "1.89"

[dependencies]
anyhow = "1.0.100"
bounded-vec-deque = "0.1.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.47", features = ["derive"] }
config = { version = "0.15.16", features = ["json"] }
derive_builder = "0.20.2"
eframe = "0.32.3"
egui_extras = "0.32.3"
egui_taffy = "0.8.1"
futures = "0.3.31"
gethostname = "1.0.2"
java-properties = "2.0.0"
rdkafka = { version = "0.38.0", features = ["dynamic-linking", "sasl", "ssl"] }
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.145"
serde_json_path = "0.7.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["json", "env-filter"] }
